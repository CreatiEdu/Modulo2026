<div class="container mt-5">

    @if(propiedad){

        <div class="row">

            <div class="col-md-8">
                
                <img
                    [src]="imagenActual"
                    class="img-fluid rounded imagen-principal w-100">

                <div class="mt-3 d-flex gap-2 flex-wrap">
                    @for (imagen of propiedad.imagenes; track imagen) {
                        <img 
                            [src]="imagen"
                            class="miniatura"
                            (click)="imagenActual = imagen"
                            style="cursor: pointer; width: 80px; height: 60px; object-fit: cover;">
                    }
                </div>

                <div class="mt-4">
                    <h3>Descripción</h3>
                    <hr>
                    <p class="text-muted"
                        style="white-space: pre-line;">
                        {{propiedad.descripcion}}
                    </p>
                </div>

            </div>

            <div class="col-md-4">
                
                <div class="mb-4">
                    <h1>{{propiedad.titulo}}</h1>
                    <p class="text-secondary"><i class="bi bi-geo-alt"></i> {{propiedad.localidad}}</p>
                    
                    <div class="d-flex gap-3 my-3">
                        <span><strong>{{propiedad.metros}}</strong> m²</span>
                        <span><strong>{{propiedad.dormitorios}}</strong> dor.</span>
                    </div>
                </div>

                <div class="card shadow-sm-custom border-0 bg-light">
                    <div class="card-body p-4">

                        <h3 class="text-primary mb-3">
                            $ {{ propiedad.precio }}
                        </h3>

                        <hr>

                        <h5 class="card-title mb-3">
                            Contactar anunciante
                        </h5>

                        <input
                            type="text"
                            class="form-control mb-3"
                            placeholder="Nombre">

                        <input
                            type="email"
                            class="form-control mb-3"
                            placeholder="Correo electrónico">

                        <textarea
                            class="form-control mb-3"
                            rows="4"
                            placeholder="Hola, me interesa esta propiedad."></textarea>

                        <button
                            class="btn btn-primary w-100 fw-bold">
                            Enviar consulta
                        </button>

                        
                    </div>
                </div>

            </div>

        </div>

    }

</div>
