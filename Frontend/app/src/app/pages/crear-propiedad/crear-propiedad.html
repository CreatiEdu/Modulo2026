<div class="container my-5">
  <div class="row justify-content-center">

    <div class="col-md-8">

      <div class="card shadow border-0">

        <div class="card-header  text-white py-3">
          <h3 class="mb-0 text-center">
            Publicar Nuevo Inmueble
          </h3>
        </div>

        <div class="card-body p-4">

          <form
            #inmuebleForm="ngForm"
            (ngSubmit)="onSubmit(inmuebleForm)"
          >

            <div class="mb-3">
              <label class="form-label">
                Título
              </label>

              <input
                type="text"
                name="titulo"
                class="form-control"
                required
                ngModel
              >
            </div>

            <div class="mb-3">
              <label class="form-label">
                Dirección
              </label>

              <input
                type="text"
                name="direccion"
                class="form-control"
                required
                ngModel
              >
            </div>

            <div class="mb-3">
              <label class="form-label">
                Precio
              </label>

              <input
                type="number"
                name="precio"
                class="form-control"
                required
                ngModel
              >
            </div>

            <div class="mb-3">
              <label class="form-label">
                Descripción
              </label>

              <textarea
                name="descripcion"
                rows="5"
                class="form-control"
                required
                ngModel
              ></textarea>
            </div>

            <div class="form-check mb-4">

              <input
                type="checkbox"
                class="form-check-input"
                name="disponible"
                ngModel
                checked
              >

              <label class="form-check-label">
                Disponible
              </label>

            </div>

            <div class="mb-4">
                <label class="form-label">
                    Imágenes
                </label>
                <input
                type="file"
                class="form-control"
                multiple
                accept="image/*"
                (change)="onFileChange($event)">
            </div>

            <div class="text-end">

              <button
                type="submit"
                class="btn btn-primary"
                [disabled]="!inmuebleForm.valid"
              >
                Publicar Inmueble
              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>
</div>
