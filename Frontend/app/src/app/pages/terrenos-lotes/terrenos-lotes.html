<div class="container mt-5">

    <h1 class="mb-4">
        Terrenos y Lotes en Venta
    </h1>

    <div class="row mb-4">

        <div class="col-md-3">

            <select
                class="form-select"
                [(ngModel)]="localidadSeleccionada">

                <option value="">
                    Localidad
                </option>

                @for(localidad of localidades; track localidad){

                    <option [value]="localidad">
                        {{localidad}}
                    </option>

                }

            </select>

        </div>

        <div class="col-md-2">

            <input
                type="number"
                class="form-control"
                placeholder="Precio máximo"
                [(ngModel)]="precioMaximo">

        </div>

    </div>

    <div class="row">

        @for(terreno of terrenosFiltrados; track terreno.titulo){

            <div class="col-md-4 mb-4">

                <div class="card h-100">

                    <img
                        [src]="terreno.imagenes[0]"
                        class="card-img-top"
                        alt="{{terreno.titulo}}"
                        style="object-fit: cover; height: 250px;">

                    <div class="card-body">

                        <span class="badge bg-success">
                            Venta
                        </span>

                        <h5 class="mt-3">
                            {{terreno.titulo}}
                        </h5>

                        <p>
                            {{terreno.localidad}}
                        </p>

                        <p>
                            {{terreno.metros}}
                        </p>

                        <p>
                            {{terreno.tipo}}
                        </p>

                        <h4>
                            U$S {{terreno.precio}}
                        </h4>

                        <button
                            class="btn btn-primary w-100"
                            [routerLink]="['/propiedad', terreno.id]">

                            Ver detalles

                        </button>

                    </div>

                </div>

            </div>

        }

    </div>

</div>
