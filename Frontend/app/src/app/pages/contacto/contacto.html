<div class="container contacto-container">

  <div class="contacto-header">
    <h1>Contacto</h1>
    <p>Comunicate con INMOSMART para consultas y asesoramiento.</p>
  </div>

  <div class="contenido-contacto">

   <!-- FORMULARIO -->
<form
  class="formulario"
  action="https://formspree.io/f/xwvzdkqo"
  method="POST"
>
 <input
    type="hidden"
    name="_next"
    value="http://localhost:4200/contacto"
  >
  <input
  type="hidden"
  name="_subject"
  value="Nuevo mensaje desde INMOSMART"
/>
  <input
    type="text"
    name="nombre"
    placeholder="Tu nombre"
    required
  >
  <input
  type="tel"
  name="telefono"
  placeholder="Tu teléfono"
  required
  >

  <input
    type="email"
    name="email"
    placeholder="Tu email"
    required
  >

  <input
    type="text"
    name="asunto"
    placeholder="Asunto"
    required
  >

  <textarea
    name="mensaje"
    rows="5"
    placeholder="Escribí tu mensaje"
    required
  ></textarea>

  <button type="submit">
    Enviar
  </button>

</form>
