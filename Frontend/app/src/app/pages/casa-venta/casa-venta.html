<div class="container mt-5">

    <h1 class="mb-4">Casas en venta</h1>

    <div class="row mb-4">
        <div class="col-md-3">
            <select class="form-select" [(ngModel)]="localidadSeleccionada">
                <option value="">Localidad</option>
                @for(localidad of localidades; track localidad){
                    <option [value]="localidad">{{localidad}}</option>
                }
            </select>
        </div>

        <div class="col-md-2">
            <input 
                type="number" 
                class="form-control" 
                placeholder="Precio Máx." 
                [(ngModel)]="precioMaximo">
        </div>
    </div>

    <div class="row">
        @for(propiedad of propiedadesFiltradas; track propiedad.id){
            <div class="col-md-4 mb-4">
                <div class="card h-100">
                    <img 
                        [src]="propiedad.imagenes[0] || 'assets/no-image.png'" 
                        class="card-img-top" 
                        alt="{{propiedad.titulo}}" 
                        style="object-fit: cover; height: 250px;">

                    <div class="card-body">
                        <span class="badge bg-primary">{{propiedad.operacion}}</span>

                        <h5 class="mt-3">{{propiedad.titulo}}</h5>
                        <p class="text-muted mb-1">{{propiedad.localidad}}</p>
                        <p class="mb-1">{{propiedad.metros}} m²</p>
                        <p class="mb-3">{{propiedad.dormitorios}} dormitorios</p>

                        <h4 class="mb-3">$ {{propiedad.precio | number}}</h4>

                        <button class="btn btn-primary w-100" [routerLink]="['/propiedad', propiedad.id]">
                            Ver detalles
                        </button>
                    </div>
                </div>
            </div>
        }
    </div>
</div>
